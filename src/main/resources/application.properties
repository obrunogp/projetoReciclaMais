# Conexão local: use variáveis de ambiente; não grave senhas no repositório.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/reciclagem}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
server.address=127.0.0.1

# Valida o mapeamento sem criar, apagar ou alterar tabelas do banco.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
